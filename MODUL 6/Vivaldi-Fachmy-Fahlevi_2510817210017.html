        .photo-box {
            aspect-ratio: 16 / 9;
            background-color: #666;
            border: 2px solid white;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;

        }

        .social-icons a {
        color: #333;
        font-size: 20px;
        width: 30px;
        text-align: center;
        text-decoration: none;
        transition: 0.3s;
        }

        .social-icons a:hover {
